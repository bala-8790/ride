<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi Srinivasa Auto Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Lakshmi Srinivasa Auto Service</h1>
    </header>

    <main class="layout-wrapper">
        <!-- Left: Driver Details -->
        <section class="card">
            <h3>Driver Details</h3>
            <div class="card-content">
                <div class="avatar">🛺</div>
                <p><strong>Driver:</strong> Srinivasa Rao</p>
                <p><strong>Vehicle:</strong> TS 03 AP 1234</p>
                <p><strong>Rating:</strong> ⭐ 4.9 (200+ Rides)</p>
                <p><strong>Status:</strong> <span class="status">Available</span></p>
            </div>
        </section>

        <!-- Middle: Fare Calculator -->
        <section class="card">
            <h3>Fare Calculator</h3>
            <div class="card-content">
                <label for="distance">Estimated Distance (km):</label>
                <input type="number" id="distance" placeholder="Enter kilometers" oninput="calculateFare()">
                
                <div class="fare-display">
                    <p>Estimated Fare</p>
                    <h2 id="fare-result">₹ 0.00</h2>
                </div>
                <p class="small-text">*Base ₹30 + ₹15 per km</p>
            </div>
        </section>

        <!-- Right: Booking Form -->
        <section class="card">
            <h3>Book Your Ride</h3>
            <div class="card-content">
                <input type="text" id="name" placeholder="Your Name">
                <input type="text" id="phone" placeholder="Phone Number">
                <input type="text" id="pickup" placeholder="Pickup Location">
                <input type="text" id="drop" placeholder="Drop Location">

                <button class="whatsapp-btn" onclick="sendWhatsAppBooking()">
                    Book on WhatsApp
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
